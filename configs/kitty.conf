# Avançado {{{

shell .
# O programa shell a executar. O valor padrão de . significa usar
# o shell configurado como shell padrão para o usuário atual.
# Note que no macOS, se você alterar isso, pode precisar adicionar
# --login para garantir que o shell inicie no modo interativo e
# leia seus arquivos rc de inicialização.

editor vim 
# O editor de console a usar ao editar o arquivo de configuração do kitty ou
# tarefas similares. Um valor de . significa usar as variáveis de ambiente
# VISUAL e EDITOR nessa ordem. Note que essa variável de ambiente
# deve estar definida não apenas em seus scripts de inicialização do shell, mas
# globalmente, caso contrário, o kitty não a verá.

# close_on_child_death no
# Fechar a janela quando o processo filho (shell) sair. Se não (o
# padrão), o terminal permanecerá aberto quando o filho sair enquanto
# houver processos ainda enviando saída para o terminal (por exemplo,
# processos desanexados ou em segundo plano). Se sim, a janela
# será fechada assim que o processo filho sair. Note que definir como
# sim significa que qualquer processo em segundo plano ainda usando o terminal
# pode falhar silenciosamente porque seu stdout/stderr/stdin não funcionam mais.

# allow_remote_control no
# Permitir que outros programas controlem o kitty. Se você ativar isso, outros
# programas podem controlar todos os aspectos do kitty, incluindo o envio de texto
# para janelas kitty, abertura de novas janelas, fechamento de janelas, leitura do
# conteúdo das janelas, etc. Note que isso funciona até mesmo através de conexões ssh.
# Você pode escolher permitir que qualquer programa em execução dentro do kitty
# controle-o, com sim, ou apenas programas que se conectam ao socket especificado com
# o comando kitty --listen-on
# opção, se você usar o valor socket-only. Este último é útil se
# você deseja impedir que programas executados em um computador remoto via ssh
# controlem o kitty.

# listen_on none
# Informe ao kitty para escutar o socket unix/tcp especificado para conexões de 
# controle remoto. Note que isso se aplicará a todas as instâncias do kitty. Pode 
# ser substituído usando a opção de linha de comando kitty --listen-on. Esta opção 
# aceita apenas sockets UNIX, como unix:${TEMP}/mykitty ou (no Linux) unix:@mykitty. 
# Variáveis de ambiente são expandidas. Se {kitty_pid} estiver presente, ele é 
# substituído pelo PID do processo kitty, caso contrário, o PID do processo kitty é
# anexado ao valor, com um hífen. Esta opção é ignorada a menos que você também 
# defina allow_remote_control para habilitar o controle remoto. Veja a ajuda para 
# kitty --listen-on para mais detalhes.

# env
# Especifique variáveis de ambiente para definir em todos os processos filhos. 
# Note que variáveis de ambiente são expandidas recursivamente, então se você usar::

# env MYVAR1=a
# env MYVAR2=${MYVAR1}/${HOME}/b

# O valor de MYVAR2 será a/<caminho para o diretório home>/b.

# update_check_interval 24

# Verifique periodicamente se há uma atualização disponível para o kitty. Se uma 
#atualização for encontrada, uma notificação do sistema é exibida informando sobre
#a atualização disponível. O padrão é verificar a cada 24 horas, defina como zero
#para desativar.

# startup_session none
# Caminho para um arquivo de sessão a ser usado para todas as instâncias do kitty.
# Pode ser substituído usando a opção de linha de comando kitty --session para 
# instâncias individuais. Veja https://sw.kovidgoyal.net/kitty/index.html#sessions 
# na documentação do kitty para mais detalhes. Note que caminhos relativos são 
# interpretados em relação ao diretório de configuração do kitty. Variáveis de 
# ambiente no caminho são expandidas.

# clipboard_control write-clipboard write-primary
# Permitir que programas executados no kitty leiam e escrevam na área de transferência.
#Você pode controlar exatamente quais ações são permitidas. O conjunto de ações possíveis 
# é: write-clipboard read-clipboard write-primary read-primary. Você pode adicionalmente 
# especificar no-append para desativar a extensão do protocolo do kitty para concatenação 
# da área de transferência. O padrão é permitir a escrita na área de transferência 
# e na seleção primária com concatenação habilitada. Note que habilitar a funcionalidade 
# de leitura é um risco de segurança, pois significa que qualquer programa, até mesmo 
# um executado em um servidor remoto via SSH, pode ler sua área de transferência.

# allow_hyperlinks yes
# Processar sequências de escape de hiperlink (OSC 8). Se desativado, sequências 
# de escape OSC 8 são ignoradas. Caso contrário, elas se tornam links clicáveis, que 
# você pode clicar mantendo a tecla ctrl+shift pressionada e clicando com o mouse. 
# O valor especial ``ask`` significa que o kitty perguntará antes de abrir o link.

# term xterm-kitty
# O valor da variável de ambiente TERM a ser definido. Alterar isso pode quebrar 
# muitos programas de terminal, só altere se você souber o que está fazendo, não porque 
# você leu algum conselho no Stack Overflow para mudar. A variável TERM é usada por 
# vários programas para obter informações sobre as capacidades e comportamentos do 
# terminal. Se você alterá-la, dependendo dos programas que você executa e quão diferente 
# o terminal que você está alterando é, várias coisas, desde pressionamentos de tecla 
# até cores e várias funcionalidades avançadas podem não funcionar.
# }}}

# Ajustes específicos do OS {{{

# macos_titlebar_color system
# Mudar a cor da barra de título da janela do kitty no macOS. Um valor
# de system significa usar a cor padrão do sistema, um valor de
# background significa usar a cor de fundo da janela atualmente ativa e, por fim, 
# você pode usar uma cor arbitrária, como
# #12af59 ou vermelho. AVISO: Esta opção funciona usando um truque, já que não há 
# uma API Cocoa apropriada para isso. Ela define a cor de fundo da janela inteira e 
# torna a barra de título transparente. Como tal, é incompatível com background_opacity. 
# Se você deseja usar ambos, é melhor simplesmente esconder a barra de título com
# hide_window_decorations.

# macos_option_as_alt no
# Usar a tecla option como uma tecla alt. Com isso definido como não, o kitty usará 
# o comportamento nativo de Option+Key = caractere unicode do macOS. Isso quebrará 
# qualquer atalho de teclado Alt+key em seus programas de terminal, mas você pode usar 
# a técnica de entrada Unicode do macOS. Você pode usar os valores: left, right ou 
# both para usar apenas as teclas Option esquerda, direita ou ambas como Alt.

# macos_hide_from_tasks no
# Ocultar a janela do kitty das tarefas em execução (Option+Tab) no macOS.

# macos_quit_when_last_window_closed no
# Fazer o kitty sair quando todas as janelas de nível superior forem fechadas. Por 
# padrão, o kitty continuará em execução, mesmo com nenhuma janela aberta, como é o 
# comportamento esperado no macOS.

# macos_window_resizable yes
# Desative isso se você não quiser que as janelas de nível superior (OS) do kitty 
# sejam redimensionáveis no macOS.

# macos_thicken_font 0
# Desenhar uma borda extra ao redor da fonte com a largura dada, para
# aumentar a legibilidade em tamanhos pequenos de fonte. Por exemplo, um valor de
# 0.75 resultará em uma renderização que se parece com o sub-pixel
# antialiasing em tamanhos de fonte comuns.

# macos_traditional_fullscreen no
# Usar a transição de tela cheia tradicional, que é mais rápida, mas
# menos bonita.

# macos_show_window_title_in all
# Mostrar ou ocultar o título da janela na janela do macOS ou na barra de menu. Um
# valor de window mostrará o título da janela atualmente ativa
# no topo da janela do macOS. Um valor de menubar mostrará o
# título da janela atualmente ativa na barra de menu do macOS, aproveitando o espaço
# desperdiçado. all mostrará o título em todos os lugares
# e none oculta o título na janela e na barra de menu.

# macos_custom_beam_cursor no
# Habilitar/desabilitar cursor de mouse personalizado para macOS que é mais fácil de ver
# em fundos claros e escuros. AVISO: isso pode tornar o cursor do seu mouse invisível em máquinas com GPU dual.

# linux_display_server auto
# Escolha entre os backends Wayland e X11. Por padrão, um backend apropriado baseado 
# no estado do sistema é escolhido automaticamente. Defina como x11 ou wayland para forçar a escolha.
# }}}

# Atalhos de teclado {{{
# Para uma lista de nomes de teclas, veja: os macros de tecla GLFW
# <https://github.com/kovidgoyal/kitty/blob/master/glfw/glfw3.h#L349>.
# O nome a ser usado é a parte após o prefixo GLFW_KEY_. Para uma lista
# de nomes de modificadores, veja: GLFW mods
# <https://www.glfw.org/docs/latest/group__mods.html>

# No Linux, você também pode usar nomes de teclas XKB para mapear teclas que não são
# suportadas pelo GLFW. Veja as teclas XKB
# <https://github.com/xkbcommon/libxkbcommon/blob/master/xkbcommon/xkbcommon-
# keysyms.h> para uma lista de nomes de teclas. O nome a ser usado é a parte
# após o prefixo XKB_KEY_. Note que você só pode usar um nome de tecla XKB para teclas 
# que não são conhecidas como teclas GLFW.

# Finalmente, você pode usar códigos de chave de sistema brutos para mapear teclas, novamente apenas
# para teclas que não são conhecidas como teclas GLFW. Para ver o código de sistema
# para uma tecla, inicie o kitty com a opção kitty --debug-keyboard.
# Então o kitty exibirá algum texto de depuração para cada evento de tecla. Nesse
# texto, procure ``native_code`` o valor disso se torna o nome da tecla no atalho. Por exemplo:

# .. code-block:: none

# on_key_input: glfw key: 65 native_code: 0x61 action: PRESS mods: 0x0 text: 'a'

# Aqui, o nome da tecla para a tecla A é 0x61 e você pode usá-lo com::

# map ctrl+0x61 something

# para mapear ctrl+a para algo.

# Você pode usar a ação especial no_op para desmapear um atalho de teclado
# que está atribuído na configuração padrão::

# map kitty_mod+space no_op

# Você pode combinar várias ações para serem acionadas por um único
# atalho, usando a sintaxe abaixo::

# map key combine <separator> action1 <separator> action2 <separator> action3 ...
# Por exemplo::

# map kitty_mod+e combine : new_window : next_layout

# Isso criará uma nova janela e mudará para o próximo layout disponível.

# Você pode usar atalhos de múltiplas teclas usando a sintaxe mostrada abaixo::

# map key1>key2>key3 action

# Por exemplo::

# map ctrl+f>2 set_font_size 20


# O valor de kitty_mod é usado como o modificador para todos os atalhos padrão,
# você pode alterá-lo no seu kitty.conf para mudar os modificadores para todos os atalhos padrão.

# clear_all_shortcuts no

# Você pode fazer com que o kitty remova todas as definições de atalhos vistas até este ponto.
# Útil, por exemplo, para remover os atalhos padrão.

# kitten_alias hints hints --hints-offset=0

# Você pode criar aliases para nomes de kitten, isso permite sobrescrever os padrões
# para opções de kitten e também pode ser usado para encurtar mapeamentos repetidos
# do mesmo kitten com um grupo específico de opções. Por exemplo, o alias acima muda o valor padrão de
# kitty +kitten hints --hints-offset para zero para todos os mapeamentos, incluindo os padrões.

# Clipboard {{{

# map kitty_mod+c copy_to_clipboard

# Também há uma ação copy_or_interrupt que pode ser opcionalmente
# mapeada para Ctrl+c. Ela copiará apenas se houver uma seleção e
# enviará um interrupt caso contrário. Da mesma forma, copy_and_clear_or_interrupt
# copiará e limpará a seleção ou enviará um interrupt se não houver
# seleção.

# map kitty_mod+v  paste_from_clipboard
# map kitty_mod+s  paste_from_selection
# map shift+insert paste_from_selection
paste_actions quote-urls-at-prompt,confirm

# Você também pode passar o conteúdo da seleção atual para qualquer
# programa usando pass_selection_to_program. Por padrão, o programa open do sistema é usado,
# mas você pode especificar o seu próprio, a seleção será passada como um argumento 
# de linha de comando para o programa, por exemplo::

# map kitty_mod+o pass_selection_to_program firefox

# Você pode passar a seleção atual para um programa de terminal executado em
# uma nova janela kitty, usando o placeholder @selection::

# map kitty_mod+y new_window less @selection

# }}}

# Rolagem {{{

# map ctrl+up scroll_line_up
# map ctrl+k  scroll_line_up
# map ctrl+down  scroll_line_down
# map ctrl+j  scroll_line_down
# map ctrl+page_up   scroll_page_up
# map ctrl+page_down scroll_page_down
# map ctrl+home  scroll_home
# map ctrl+end   scroll_end
# map kitty_mod+h show_scrollback

# Você pode enviar o conteúdo da tela atual + buffer de histórico como
# STDIN para um programa arbitrário usando a função ``launch``. Por exemplo, o seguinte 
# abre o buffer de rolagem no less em uma janela sobreposta::

# map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

# Para mais detalhes sobre como enviar conteúdos da tela e buffer para programas externos, veja launch.

# }}}

# Gerenciamento de Janelas {{{

# Você pode abrir uma nova janela executando um programa arbitrário, por exemplo::

# map kitty_mod+y  launch mutt

# Você pode abrir uma nova janela com o diretório de trabalho atual definido para
# o diretório de trabalho da janela atual usando::

# map ctrl+alt+enter launch --cwd=current

# Você pode abrir uma nova janela que pode controlar o kitty através do
# recurso de controle remoto do kitty, prefixando a linha de comando com @.
# Qualquer programa executado nessa janela terá permissão para controlar
# o kitty. Por exemplo::

# map ctrl+enter launch --allow-remote-control some_program

# Você pode abrir uma nova janela ao lado da janela ativa atualmente ou como
# a primeira janela, com::

# map ctrl+n launch --location=neighbor some_program
# map ctrl+f launch --location=first some_program

# Para mais detalhes, veja launch.

# map kitty_mod+n new_os_window

# Funciona como new_window acima, exceto que abre uma janela de nível superior do OS.
# Em particular, você pode usar new_os_window_with_cwd para abrir uma janela com o diretório de trabalho atual.

# map ctrl+w close_window
# map kitty_mod+] next_window
# map kitty_mod+[ previous_window
# map kitty_mod+f move_window_forward
# map kitty_mod+b move_window_backward
# map kitty_mod+` move_window_to_top
# map kitty_mod+r start_resizing_window
# map kitty_mod+1 first_window
# map kitty_mod+2 second_window
# map kitty_mod+3 third_window
# map kitty_mod+4 fourth_window
# map kitty_mod+5 fifth_window
# map kitty_mod+6 sixth_window
# map kitty_mod+7 seventh_window
# map kitty_mod+8 eighth_window
# map kitty_mod+9 ninth_window
# map kitty_mod+0 tenth_window
# }}}

# Gerenciamento de Abas {{{

# map kitty_mod+right next_tab
# map kitty_mod+left  previous_tab
# map kitty_mod+t new_tab
# map kitty_mod+q close_tab
# map kitty_mod+. move_tab_forward
# map kitty_mod+, move_tab_backward
# map kitty_mod+alt+t set_tab_title

# Você também pode criar atalhos para ir a abas específicas, com 1 sendo
# a primeira aba, 2 a segunda aba e -1 sendo a aba anteriormente ativa,
# e qualquer número maior que a última aba sendo a última aba::

# map ctrl+alt+1 goto_tab 1
# map ctrl+alt+2 goto_tab 2

# Assim como com new_window acima, você também pode passar o nome de
# comandos arbitrários para executar ao usar new_tab e usar
# new_tab_with_cwd. Finalmente, se você deseja que a nova aba abra ao lado
# da aba atual em vez de no final da lista de abas, use::

# map ctrl+t new_tab !neighbor [cmd opcional para executar]
# }}}

# Gerenciamento de Layouts {{{

# map kitty_mod+l next_layout

# Você também pode criar atalhos para alternar para layouts específicos::

# map kitty_mod+t goto_layout tall
# map kitty_mod+s goto_layout stack

# Da mesma forma, para voltar ao layout anterior::

# map ctrl+alt+p last_used_layout
# }}}

# Tamanhos de Fonte {{{

# Você pode alterar o tamanho da fonte para todas as janelas de nível superior do kitty
# ao mesmo tempo ou apenas para a atual.

map kitty_mod+equal change_font_size all +0.5
map kitty_mod+minus change_font_size all -0.5
# map kitty_mod+backspace change_font_size all 0

# Para configurar atalhos para tamanhos específicos de fonte::

# map kitty_mod+f6 change_font_size all 10.0

# Para configurar atalhos para alterar apenas o tamanho da fonte da janela do OS atual::

# map kitty_mod+f6 change_font_size current 10.0
# }}}

# Selecionar e agir sobre texto visível {{{

# Use o kitten hints para selecionar texto e passar para um
# programa externo ou inseri-lo no terminal ou copiá-lo para a
# área de transferência.

# map kitty_mod+i kitten hints

# Abra uma URL visível atualmente usando o teclado. O programa usado
# para abrir a URL é especificado em open_url_with.

# map kitty_mod+p>f kitten hints --type path --program -

# Selecione um caminho/nome de arquivo e insira-o no terminal. Útil, por
# exemplo, para executar comandos git em um nome de arquivo obtido de um comando
# git anterior.

# map kitty_mod+p>shift+f kitten hints --type path

# Selecione um caminho/nome de arquivo e abra-o com o programa padrão.

# map kitty_mod+p>l kitten hints --type line --program -

# Selecione uma linha de texto e insira-a no terminal. Use para a
# saída de coisas como: ls -1

# map kitty_mod+p>w kitten hints --type word --program -

# Selecione palavras e insira no terminal.

# map kitty_mod+p>h kitten hints --type hash --program -

# Selecione algo que pareça um hash e insira no terminal. Útil com git,
# que usa hashes sha1 para identificar commits.

# map kitty_mod+p>n kitten hints --type linenum

# Selecione algo que pareça filename:linenum e abra-o no vim na linha especificada.

# map kitty_mod+p>y kitten hints --type hyperlink

# Selecione um hyperlink (ou seja, uma URL que foi marcada como tal pelo
# programa de terminal, por exemplo, pelo ls --hyperlink=auto).

# O hints kitten tem muitos mais modos de operação que você pode mapear
# para diferentes atalhos. Para uma descrição completa, veja kittens/hints.
# }}}

# map ctrl+x kitten zoom_window.py

# Custom kitten para ampliar uma janela

# Diversos {{{

# map kitty_mod+f11 toggle_fullscreen
# map kitty_mod+f10 toggle_maximized
# map kitty_mod+u  kitten unicode_input
# map kitty_mod+f2 edit_config_file
# map kitty_mod+escape kitty_shell window

# Abra o shell do kitty em uma nova janela/aba/sobreposição/janela_os para
# controlar o kitty usando comandos.

# map kitty_mod+a>m set_background_opacity +0.1
# map kitty_mod+a>l set_background_opacity -0.1
# map kitty_mod+a>1 set_background_opacity 1
# map kitty_mod+a>d set_background_opacity default
# map kitty_mod+delete clear_terminal reset active

# Você pode criar atalhos para limpar/resetar o terminal. Por exemplo::

# # Redefinir o terminal
# map kitty_mod+f9 clear_terminal reset active
# # Limpar a tela do terminal apagando todo o conteúdo
# map kitty_mod+f10 clear_terminal clear active
# # Limpar o histórico de rolagem do terminal apagando-o
# map kitty_mod+f11 clear_terminal scrollback active
# # Enviar o conteúdo da tela para o histórico de rolagem
# map kitty_mod+f12 clear_terminal scroll active

# Se você deseja operar em todas as janelas em vez de apenas na atual,
# use all em vez de active.

# Também é possível remapear Ctrl+L para tanto rolar o conteúdo atual da tela
# para o buffer de rolagem quanto limpar a tela, em vez de apenas limpar a tela::

# map ctrl+l combine : clear_terminal scroll active : send_text normal,application \x0c

# Você pode fazer com que o kitty envie texto arbitrário (codificado em UTF-8) para o
# programa cliente ao pressionar teclas de atalho especificadas. Por exemplo::

# map ctrl+alt+a send_text all Special text

# Isso enviará "Special text" quando você pressionar a combinação de teclas ctrl+alt+a.
# O texto a ser enviado é um literal de string em python, então você
# pode usar escapes como \x1b para enviar códigos de controle ou \u21fb para enviar
# caracteres unicode (ou você pode simplesmente inserir os caracteres unicode diretamente 
# como texto UTF-8). O primeiro argumento para send_text é o
# modo de teclado em que ativar o atalho. Os possíveis valores são normal ou application 
# ou kitty ou uma combinação separada por vírgulas deles. O
# keyword especial all significa todos os modos. Os modos normal e application referem-se 
# ao modo de cursor DECCKM para terminais, e kitty refere-se ao
# protocolo de teclado extendido especial do kitty.

# Outro exemplo, que exibe uma palavra e depois move o cursor para o início da linha 
# (igual a pressionar a tecla Home)::

# map ctrl+alt+a send_text normal Word\x1b[H
# map ctrl+alt+a send_text application Word\x1bOH
# }}}

