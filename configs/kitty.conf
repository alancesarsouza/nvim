bold_font        JetBrainsMonoNF-SemiBold
italic_font      JetBrainsMonoNF-LightItalic
bold_italic_font JetBrainsMonoNF-SemiBoldItalic

# 800 ExtraBold | ExtraBold Italic
# 700 Bold | Bold Italic
# 600 Medium | Medium Italic
# 500 SemiBold | SemiBold Italic
# 400 Regular | Italic
# 300 Light | Light Italic
# 200 ExtraLight | ExtraLight Italic
# 100 Thin | Thin Italic

# Você pode especificar diferentes fontes para as variantes negrito/itálico/negrito-itálico. 
# Para obter uma lista completa das fontes suportadas, use o comando `kitty list-fonts`.
# Por padrão, elas são derivadas automaticamente pelo sistema de fontes do sistema operacional.
# Defini-las manualmente é útil para famílias de fontes que possuem muitas variantes de peso, como
# Book, Medium, Thick, etc. Por exemplo::

# Tamanho da fonte (em pontos) / notebook: 10 | monitor 9 /
font_size 10

# force_ltr no

# O kitty não suporta BIDI (texto bidirecional), no entanto, para scripts RTL
# (da direita para a esquerda), as palavras são automaticamente exibidas em RTL.
# Ou seja, em um script RTL, as palavras "HELLO WORLD" são exibidas no kitty como
# "WORLD HELLO", e se você tentar selecionar uma substring de uma string em formato RTL,
# você obterá o caractere que estaria ali se a string fosse LTR. Por exemplo,
# assumindo a palavra hebraica ירושלים, selecionar o caractere que na tela parece ser ם
# na verdade escreve no buffer de seleção o caractere י.

# O comportamento padrão do kitty é útil em conjunto com um filtro para inverter a ordem das palavras,
# no entanto, se você deseja manipular glifos RTL, pode ser muito desafiador trabalhar com isso, então
# esta opção é fornecida para desativá-lo. Além disso, essa opção pode ser usada com o programa de linha
# de comando GNU FriBidi <https://github.com/fribidi/fribidi#executable> para obter suporte BIDI, pois
# forçará o kitty a sempre tratar o texto como LTR, o que o FriBidi espera para terminais.

# adjust_line_height  0
# adjust_column_width 0

# Altere o tamanho de cada célula de caractere que o kitty renderiza. Você pode usar
# números, que são interpretados como pixels, ou porcentagens (número seguido por %), que são interpretadas
# como porcentagens dos valores não modificados. Você pode usar pixels negativos ou porcentagens menores
# que 100% para reduzir os tamanhos (mas isso pode causar artefatos de renderização).

# symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

# Mapeie os pontos de código Unicode especificados para uma fonte específica. Útil
# se você precisar de renderização especial para alguns símbolos, como para
# Powerline. Evita a necessidade de fontes corrigidas. Cada ponto de código Unicode é
# especificado na forma U+<ponto de código em hexadecimal>. Você pode especificar vários pontos de código,
# separados por vírgulas e intervalos separados por hifens. symbol_map em si pode ser especificado várias
# vezes. A sintaxe é::

# symbol_map codepoints Font Family Name

disable_ligatures never
# Escolha como você deseja lidar com ligaduras de vários caracteres. O
# padrão é sempre renderizá-las. Você pode instruir o kitty a não renderizá-las
# quando o cursor estiver sobre elas, usando cursor para facilitar a edição,
# ou fazer com que o kitty nunca as renderize, usando always, se você não gostar delas.
# A estratégia de ligadura pode ser definida por janela usando a funcionalidade de controle remoto do kitty
# ou definindo atalhos para isso no kitty.conf, por exemplo::

# map alt+1 disable_ligatures_in active always
# map alt+2 disable_ligatures_in all never
# map alt+3 disable_ligatures_in tab cursor

# Note que isso se refere a ligaduras de programação, normalmente
# implementadas usando o recurso OpenType calt. Para desativar ligaduras gerais,
# use a configuração font_features.

# font_features yes
# Escolha exatamente quais recursos OpenType ativar ou desativar. Isso
# é útil, pois algumas fontes podem ter recursos interessantes em um
# terminal. Por exemplo, o Fira Code Retina inclui um recurso discricionário,
# zero, que nessa fonte altera a aparência do zero (0), para torná-lo mais facilmente
# distinguível de Ø. O Fira Code Retina também inclui outros recursos discricionários conhecidos
# como Stylistic Sets, que têm as tags ss01 até ss20.

# box_drawing_scale 0.001, 1, 1.5, 2

# Altere os tamanhos das linhas usadas para os caracteres Unicode de desenho de caixas.
# Esses valores estão em pontos. Eles serão escalados pela DPI do monitor para obter um valor em pixels.
# Devem haver quatro valores correspondentes a linhas finas, normais, grossas e muito grossas.

# }}}

# Cursor customization {{{

# cursor #cccccc

# Cor padrão do cursor

# cursor_text_color #111111

# Escolha a cor do texto sob o cursor. Se preferir que seja renderizado
# com a cor de fundo da célula abaixo, use a palavra-chave especial: background

# cursor_shape block
# A forma do cursor pode ser uma das seguintes: (block, beam, underline)

# cursor_beam_thickness 1.5
# Define a espessura do cursor de feixe (em pontos)

# cursor_underline_thickness 2.0

# Define a espessura do cursor sublinhado (em pontos)

# cursor_blink_interval -1

# O intervalo (em segundos) no qual o cursor deve piscar. Defina como zero
# para desativar o piscar. Valores negativos significam usar o padrão do sistema. Note
# que números menores que repaint_delay serão limitados a repaint_delay.

# cursor_stop_blinking_after 15.0

# Para de piscar após o número especificado de segundos de
# inatividade do teclado. Defina como zero para nunca parar de piscar.

# }}}

# Scrollback {{{

# scrollback_lines 2000

# Número de linhas de histórico a serem mantidas na memória para rolar para trás.
# A memória é alocada sob demanda. Números negativos são (efetivamente)
# rolagem infinita. Note que usar uma rolagem muito grande não é recomendado
# pois pode diminuir o desempenho do terminal e também usar grandes quantidades de RAM.
# Em vez disso, considere usar scrollback_pager_history_size.

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Programa com o qual visualizar a rolagem para trás em uma nova janela. O
# buffer de rolagem para trás é passado como STDIN para este programa. Se você mudar
# isso, certifique-se de que o programa que você usa pode lidar com sequências de escape ANSI
# para cores e formatação de texto. INPUT_LINE_NUMBER na linha de comando
# acima será substituído por um inteiro representando qual linha
# deve estar no topo da tela. Da mesma forma, CURSOR_LINE e
# CURSOR_COLUMN serão substituídos pela posição atual do cursor.

# scrollback_pager_history_size 0

# Tamanho do histórico de rolagem separado, usado apenas para navegação no
# buffer de rolagem para trás (em MB). Este buffer separado não está disponível
# para rolagem interativa, mas será passado para o programa de visualização
# ao visualizar o buffer de rolagem em uma janela separada. A implementação atual
# armazena os dados em UTF-8, então aproximadamente 10000
# linhas por megabyte a 100 caracteres por linha, para texto puro ASCII,
# texto não formatado. Um valor zero ou menor desativa este recurso.
# O tamanho máximo permitido é 4GB.

# wheel_scroll_multiplier 5.0

# Modifique a quantidade rolada pelo mouse. Note que isso é usado apenas
# para dispositivos de rolagem de baixa precisão, não para rolagem de alta precisão
# em plataformas como macOS e Wayland. Use números negativos para alterar a direção da rolagem.

# touch_scroll_multiplier 1.0

# Modifique a quantidade rolada por um touchpad. Note que isso é usado apenas
# para dispositivos de rolagem de alta precisão em plataformas como macOS e
# Wayland. Use números negativos para alterar a direção da rolagem.

# }}}

# Mouse {{{

# mouse_hide_wait 3.0

# Oculte o cursor do mouse após o número especificado de segundos sem uso.
# Defina como zero para desativar a ocultação do cursor do mouse.
# Defina um valor negativo para ocultar o cursor do mouse imediatamente ao digitar texto.
# Desativado por padrão no macOS, pois torná-lo funcional com o mar de bugs que é o Cocoa
# é um esforço excessivo.

url_color #0087bd
url_style curly
# A cor e o estilo para destacar URLs

# Os modificadores para substituir a seleção do mouse mesmo quando um aplicativo de terminal
# tenha capturado o mouse

# select_by_word_characters @-./_~?&=%+#

# Caracteres considerados parte de uma palavra ao dar duplo clique. Além desses caracteres, 
# qualquer caractere que seja marcado como
# um caractere alfanumérico no banco de dados Unicode será correspondido.

# click_interval -1.0

# O intervalo entre cliques sucessivos para detectar cliques duplos/triplos (em segundos). 
# Números negativos usarão o padrão do sistema,
# se disponível, ou retornarão a 0,5.

# focus_follows_mouse no

# Defina a janela ativa para a janela sob o mouse ao mover o
# mouse ao redor.

# pointer_shape_when_grabbed arrow

# A forma do ponteiro do mouse quando o programa em execução no
# terminal captura o mouse. Valores válidos são: arrow, beam e hand.

# default_pointer_shape beam

# A forma padrão do ponteiro do mouse. Valores válidos são: arrow,
# beam e hand.

# pointer_shape_when_dragging beam

# A forma padrão do ponteiro do mouse ao arrastar o texto.
# Valores válidos são: arrow, beam e hand.

# }}}

# Ajuste de desempenho {{{

# repaint_delay 10

# Atraso (em milissegundos) entre atualizações de tela. Reduzir
# aumenta os quadros por segundo (FPS) à custa de mais uso de CPU.
# O valor padrão resulta em ~100 FPS, que é mais do que suficiente para
# a maioria dos usos. Note que para realmente alcançar 100 FPS, você deve
# definir sync_to_monitor como no ou usar um monitor com uma alta taxa de
# atualização. Além disso, para minimizar a latência quando há entrada pendente a ser
# processada, repaint_delay é ignorado.

# input_delay 3

# Atraso (em milissegundos) antes que a entrada do programa em
# execução no terminal seja processada. Note que diminuir isso aumentará
# a capacidade de resposta, mas também aumentará o uso da CPU e pode causar cintilação
# em programas de tela cheia que redesenham toda a tela em cada loop,
# porque o kitty é tão rápido que atualizações parciais da tela serão desenhadas.

# sync_to_monitor yes

# Sincronize atualizações de tela com a taxa de atualização do monitor. Isso
# previne o tearing (https://en.wikipedia.org/wiki/Screen_tearing)
# ao rolar. No entanto, limita a velocidade de renderização à
# taxa de atualização do seu monitor. Com um mouse muito rápido / alta
# taxa de repetição do teclado, você pode notar alguma latência leve na entrada. Se
# for o caso, defina isso como não.

# }}}

# Sino do terminal {{{

enable_audio_bell no 
# Habilitar/desabilitar o sino de áudio. Útil em ambientes que exigem
# silêncio.

visual_bell_duration 0.0
# Duração do sino visual. Faça a tela piscar quando ocorrer um sino pelo
# número especificado de segundos. Defina como zero para desativar.

window_alert_on_bell no 
# Solicitar atenção da janela ao ocorrer um sino. Faz com que o ícone do dock pule no
# macOS ou a barra de tarefas pisque no Linux.

bell_on_tab no 
# Mostrar um símbolo de sino na aba se um sino ocorrer em uma das
# janelas na aba e a janela não for a janela atualmente focada.

command_on_bell none
# Programa a ser executado quando ocorrer um sino.

# }}}

# Layout da janela {{{

# remember_window_size yes
# initial_window_width 640
# initial_window_height 400

# Se habilitado, o tamanho da janela será lembrado para que novas
# instâncias do kitty tenham o mesmo tamanho que a instância anterior.
# Se desabilitado, a janela terá inicialmente o tamanho
# configurado por initial_window_width/height, em pixels. Você pode usar um
# sufixo "c" nos valores de largura/altura para que eles sejam interpretados
# como número de células em vez de pixels.

# enabled_layouts splits,stack

# map ctrl+e launch --location=vsplit --cwd=current
# map ctrl+o launch --location=hsplit --cwd=current
# map ctrl+enter launch --location=hsplit --cwd=current
#
# map ctrl+h previous_window
# map ctrl+l next_window

# Os layouts de janela habilitados. Uma lista separada por vírgulas de nomes de layout.
# O valor especial all significa todos os layouts. O primeiro layout listado
# será usado como o layout de inicialização. A configuração padrão é todos
# os layouts em ordem alfabética. Para uma lista de layouts disponíveis, consulte
# https://sw.kovidgoyal.net/kitty/index.html#layouts.

# window_resize_step_cells 2
# window_resize_step_lines 2

# O tamanho do passo (em unidades de largura/altura de célula) a ser usado ao
# redimensionar janelas. O valor de células é usado para redimensionamento horizontal
# e o valor de linhas para redimensionamento vertical.

window_border_width 0pt
# A largura das bordas da janela. Pode ser em pixels (px) ou pts
# (pt). Valores em pts serão arredondados para o número mais próximo de pixels
# com base na resolução da tela. Se não especificado, a unidade é assumida como
# pts. Note que as bordas são exibidas apenas quando mais de uma
# janela está visível. Elas servem para separar várias janelas.

draw_minimal_borders yes
# Desenhe apenas as bordas mínimas necessárias. Isso significa que apenas as
# bordas mínimas necessárias para janelas inativas são desenhadas. Ou seja, apenas
# as bordas que separa a janela inativa de um vizinho. Note que definir uma margem de
# janela não zero substitui isso e faz com que todas as bordas sejam desenhadas.

window_margin_width 0
# A margem da janela (em pts) (área em branco fora da borda). Um
# único valor define todos os quatro lados. Dois valores definem os lados vertical e
# horizontal. Três valores definem o topo, horizontal e inferior. Quatro
# valores definem o topo, direito, inferior e esquerdo.

# single_window_margin_width -1
# A margem da janela (em pts) a ser usada quando apenas uma única janela está
# visível. Valores negativos farão com que o valor de
# window_margin_width seja usado em vez disso. Um único valor define todos
# os quatro lados. Dois valores definem os lados vertical e horizontal. Três
# valores definem o topo, horizontal e inferior. Quatro valores definem o topo, direito,
# inferior e esquerdo.

# window_padding_width 0
# O preenchimento da janela (em pts) (área em branco entre o texto e a
# borda da janela). Um único valor define todos os quatro lados. Dois valores definem
# os lados vertical e horizontal. Três valores definem o topo, horizontal
# e inferior. Quatro valores definem o topo, direito, inferior e esquerdo.

# placement_strategy center
# Quando o tamanho da janela não é um múltiplo exato do tamanho da célula, a
# área de célula da janela do terminal terá algum preenchimento extra nas
# laterais. Você pode controlar como esse preenchimento é distribuído com
# esta opção. Usar um valor de center significa que a área de célula será
# colocada centralmente. Um valor de top-left significa que o preenchimento estará
# apenas nas bordas inferior e direita.

# active_border_color #00ff00
# A cor da borda da janela ativa. Defina isso como none para
# não desenhar bordas ao redor da janela ativa.

# inactive_border_color #cccccc
# A cor da borda das janelas inativas.

# bell_border_color #ff5a00


# inactive_text_alpha 1.0
# Fade o texto em janelas inativas pela quantidade especificada (um número
# entre zero e um, com zero sendo totalmente desbotado).
# Esconder as decorações da janela (barra de título e bordas da janela) com
# sim. No macOS, pode-se usar apenas titlebar-only para esconder apenas a barra de título.
# Se isso funciona e qual efeito exato tem depende do
# gerenciador de janelas/sistema operacional.

# resize_debounce_time 0.1
# O tempo (em segundos) a esperar antes de redesenhar a tela quando um
# evento de redimensionamento é recebido. Em plataformas como o macOS, onde o
# sistema operacional envia eventos correspondentes ao início e ao fim de
# um redimensionamento, esse número é ignorado.

# resize_draw_strategy static
# Escolha como o kitty desenha uma janela enquanto um redimensionamento está em andamento. Um
# valor de static significa desenhar o conteúdo atual da janela, quase
# inalterado. Um valor de scale significa desenhar o conteúdo atual da janela
# escalado. Um valor de blank significa desenhar uma janela em branco. Um valor de size
# significa mostrar o tamanho da janela em células.

# resize_in_steps no
# Redimensionar a janela do sistema operacional em etapas tão grandes quanto as células, em vez de
# com a precisão usual de pixels. Combinado com um
# initial_window_width e initial_window_height em número de células,
# essa opção pode ser usada para manter as margens o mais pequenas possível
# ao redimensionar a janela do sistema operacional. Note que isso atualmente não funciona
# no Wayland.

confirm_os_window_close 0
# Solicitar confirmação ao fechar uma janela do sistema operacional ou uma aba que tenha pelo menos esse número de janelas kitty. Um valor de zero desativa a
# confirmação. Esta confirmação também se aplica a solicitações para sair
# do aplicativo inteiro (todas as janelas do sistema operacional, via ação de sair).

# }}}

# Barra de abas {{{

# tab_bar_edge bottom

# Em qual borda mostrar a barra de abas, superior ou inferior

# tab_bar_margin_width 0.0

# A margem à esquerda e à direita da barra de abas (em pts)

# tab_bar_style fade

# O estilo da barra de abas, pode ser um dos: fade, separator, powerline ou
# hidden. No estilo fade, as bordas de cada aba desvanecem na
# cor de fundo; no estilo separator, as abas são separadas por um
# separador configurável; e o powerline mostra as abas como uma
# linha contínua. Se você usar o estilo hidden, talvez queira
# criar um mapeamento para a ação select_tab, que apresenta uma
# lista de abas e permite a troca fácil para uma aba.

# tab_bar_min_tabs 2
# O número mínimo de abas que deve existir antes da barra de abas ser
# exibida

# tab_switch_strategy previous
# O algoritmo a ser usado ao trocar para uma aba quando a aba atual
# é fechada. O padrão previous mudará para a última aba usada.
# Um valor de left mudará para a aba à esquerda da aba
# fechada. Um valor de last mudará para a aba mais à direita.

# tab_fade 0.25 0.5 0.75 1
# Controla como cada aba desbota no fundo ao usar fade para
# o tab_bar_style. Cada número é um alfa (entre zero e um)
# que controla o quanto a célula correspondente desbota no
# fundo, com zero sendo nenhum desbotamento e um sendo desbotamento total. Você
# pode alterar o número de células usadas adicionando/removendo entradas dessa
# lista.

# tab_separator " ┇"
# O separador entre abas na barra de abas ao usar separator como
# o tab_bar_style.

# tab_activity_symbol none
# Algum texto ou símbolo unicode para mostrar na aba se uma janela na
# aba que não tem foco tem alguma atividade.

# tab_title_template "{title}"
# Um modelo para renderizar o título da aba. O padrão apenas renderiza o
# título. Se você desejar incluir o índice da aba também, use algo
# como: {index}: {title}. Útil se você tiver atalhos mapeados para
# goto_tab N. Além disso, você pode usar {layout_name} para o nome atual
# do layout e {num_windows} para o número de janelas na aba.
# Note que a formatação é feita pela máquina de formatação de strings do Python,
# então você pode usar, por exemplo, {layout_name[:2].upper()}
# para mostrar apenas as duas primeiras letras do nome do layout, em maiúsculas.

# active_tab_title_template none
# Modelo a ser usado para abas ativas; se não especificado, recai sobre
# tab_title_template.

# active_tab_foreground   #000
# active_tab_background   #eee
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
# inactive_tab_font_style normal
# Cores e estilos da barra de abas

# tab_bar_background none
# Cor de fundo para a barra de abas. O padrão é usar a cor de fundo do terminal.

# }}}

# Esquema de cores {{{

foreground #e6e6dc
background #110022
# As cores de primeiro plano e fundo

background_opacity 1
# A opacidade do fundo. Um número entre 0 e 1, onde 1 é
# opaco e 0 é totalmente transparente. Isso só funcionará se
# suportado pelo SO (por exemplo, ao usar um compositor sob
# X11). Note que isso só define a opacidade da cor de fundo em
# células que têm a mesma cor de fundo que o fundo padrão do terminal.
# Isso é para que coisas como a barra de status no vim,
# prompts powerline, etc. ainda fiquem boas. Mas isso significa que se
# você usar um tema de cores com uma cor de fundo em seu editor, ela não
# será renderizada como transparente. Em vez disso, você deve alterar a
# cor de fundo padrão no seu config do kitty e não usar uma
# cor de fundo no esquema de cores do editor. Ou use os códigos de escape
# para definir as cores padrão dos terminais em um script shell para
# iniciar seu editor. Tenha em mente que usar um valor menor que 1.0 é um
# (possivelmente significativo) custo de desempenho. Se você quiser mudar dinamicamente
# a transparência das janelas, defina dynamic_background_opacity para
# sim (isso está desativado por padrão, pois tem um custo de desempenho).

background_blur 0
background_image /home/alan/.config/kitty/.wallpaper.png
# Caminho para uma imagem de fundo. Deve estar no formato PNG.

background_image_layout cscaled
# Se a imagem de fundo deve ser tileada ou escalada.

background_image_linear no
# Quando a imagem de fundo é escalada, se a interpolação linear
# deve ser usada.

dynamic_background_opacity no
# Permitir a mudança da background_opacity dinamicamente, usando atalhos de teclado (increase_background_opacity e
# decrease_background_opacity) ou a funcionalidade de controle remoto.

background_tint 0.97
# Quanto tinger a imagem de fundo pela cor de fundo. O
# tint é aplicado apenas sob a área de texto, não nas margens/bordas. Facilita
# a leitura do texto. A tintura é feita usando a cor de fundo atual para cada janela. Esta configuração se aplica apenas se
# background_opacity estiver definido e janelas transparentes são suportadas ou
# background_image estiver definida.

dim_opacity 0.2

# Quanto diminuir o texto que tem o atributo DIM/FAINT definido. Um
# significa sem diminuição e zero significa totalmente diminuído (ou seja, invisível).

# selection_foreground #000000

# O primeiro plano para o texto selecionado com o mouse. Um valor de none
